<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Friendship Surprise ❤️</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<div class="container">


<!-- Opening Question -->

<div id="questionBox">

<h1>Are you Eswar? 😊</h1>

<button onclick="startQuestions()">Yes ❤️</button>

<button onclick="noAnswer()">No 😄</button>

</div>



<!-- Questions -->

<div id="quizBox" style="display:none;">

<h2 id="questionText"></h2>

<button id="option1" onclick="nextQuestion()"></button>

<button id="option2" onclick="nextQuestion()"></button>

</div>



<!-- Surprise Quotation -->

<div id="messageBox" style="display:none;">

<h1>I Have A Surprise For You ❤️</h1>

<p>
"Some friendships are not made by blood,
they are made by memories, laughter and endless support." ✨
</p>

<p>
Thank you for being a special part of my life 🤍
</p>

<button onclick="showPhotos()">Open My Surprise 🎁</button>

</div>



<!-- Cinematic Photos -->

<div id="photoBox" style="display:none;">

<div class="slideshow">

<img id="photo" class="slide">

<h2 id="caption"></h2>

</div>

</div>



</div>


<script src="script.js"></script>

</body>

</html>
