<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Friendship Day ❤️</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<!-- Welcome Screen -->

<div id="questionBox" class="card">

<h1>Happy Friendship Day 💖</h1>

<p>Are you Eswar? 😊</p>

<button onclick="startQuestions()">Yes ❤️</button>
<button onclick="noAnswer()">No 😅</button>

</div>

<!-- Quiz -->

<div id="quizBox" class="card" style="display:none;">

<h2 id="questionText"></h2>

<button id="option1" onclick="nextQuestion()"></button>

<button id="option2" onclick="nextQuestion()"></button>

</div>

<!-- Surprise -->

<div id="messageBox" class="card" style="display:none;">

<h1>🎁 Surprise 🎁</h1>

<p>
Some friendships are not about how long we know each other...
They are about the memories we create together ❤️
</p>

<p>
Thank you for always being a part of my life.
Happy Friendship Day 🤍
</p>

<button onclick="showPhotos()">
Open My Surprise 📸
</button>

</div>

<!-- Photo Slideshow -->

<div id="photoBox" style="display:none;">

<div class="photo-container">

<img id="photo" src="" alt="Memory">

<h2 id="caption"></h2>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
